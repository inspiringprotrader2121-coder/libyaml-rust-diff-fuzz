[package]
name = "libyaml-rust-diff-fuzz-targets"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.3", features = ["derive"] }

[dependencies.libyaml-rust-diff-fuzz]
path = ".."

[[bin]]
name = "scanner_diff"
path = "fuzz_targets/scanner_diff.rs"
test = false
doc = false
bench = false
