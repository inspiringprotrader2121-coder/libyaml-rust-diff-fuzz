name: Differential Fuzz & ASan Gate (Devin PR Verifier)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  differential-fuzz-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with libyaml submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install nightly Rust + llvm-tools + AddressSanitizer support
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview, rust-src

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run 60s structure-aware differential fuzzing with forkserver & ASan
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
        run: |
          cargo +nightly fuzz run scanner_diff -- \
            -max_total_time=60 \
            -fork=1 \
            -rss_limit_mb=4096
